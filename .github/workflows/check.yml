name: Engine and browser contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run simulate -- checkpoint-1
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
